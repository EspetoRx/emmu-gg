[package]
name = "emmu-gg"
version = "0.1.0"
edition = "2024"
description = "Emmu Sega Game Gear core (WASM + native)"
repository = "https://github.com/EspetoRx/emmu-gg"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

# O núcleo de emulação (JGenesis smsgg-core + Z80 + PSG) é vendorizado dentro
# desta pasta, em `vendor/jgenesis`. Nenhum pacote de emulação fica fora do
# diretório do módulo.
[dependencies]
smsgg-core = { path = "vendor/jgenesis/backend/smsgg-core" }
jgenesis-common = { package = "jgenesis-common-gg", path = "vendor/jgenesis/common/jgenesis-common" }
smsgg-config = { path = "vendor/jgenesis/config/smsgg-config" }
bincode = "2"
wasm-bindgen = "0.2"

# O JGenesis usa `rand` para inicializar a RAM; no navegador o RNG precisa da
# API JS do getrandom.
getrandom = { version = "0.4", features = ["wasm_js"] }
